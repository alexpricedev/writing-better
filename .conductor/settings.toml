"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "main_dir=\"$(cd \"$(git rev-parse --git-common-dir)/..\" && pwd)\" && cp \"$main_dir/.env\" . && bun install && bun run scripts/workspace.ts provision"
# Safe now that provision gives every workspace its own port. Without it, two
# workspaces running `bun run dev` fight over port 3000.
run_mode = "concurrent"

[tasks.Run]
available_in = "local"
command = "bun run dev"
default = true
icon = "play"
